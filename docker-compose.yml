services:
  warehouse-brain:
    build: .
    image: warehouse-brain-mcp:latest
    restart: unless-stopped
    ports:
      - "8817:8817"
    environment:
      NOTION_API_KEY: ${NOTION_API_KEY:?set in .env}
      MCP_API_KEY: ${MCP_API_KEY:?set in .env}
      NOTION_PROJECTS_DS_ID: ${NOTION_PROJECTS_DS_ID:-}
      NOTION_ARCHIVES_DS_ID: ${NOTION_ARCHIVES_DS_ID:-}
      NOTION_TEMPLATE_ID: ${NOTION_TEMPLATE_ID:-}
